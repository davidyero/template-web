# AWS Amplify: push a `main` = despliegue. Las VITE_* por rama se definen en la consola de
# Amplify (Environment variables) y pisan a .env.production.
# Rewrite SPA en la consola: source </^[^.]+$|\.(?!(css|gif|ico|jpg|js|png|txt|svg|woff|woff2|ttf|map|json|webmanifest)$)([^.]+$)/>, target /index.html, 200.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22 || nvm install 22
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
