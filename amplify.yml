# AWS Amplify, dos ambientes: rama `develop` = dev (dev.<dominio>, `.env.staging`, sin analítica
# ni Sentry) y `main` = prod (`.env.production`). Todo se prueba en dev y pasa a main cuando
# David lo confirma. Las VITE_* de la consola de Amplify pisan a los .env.
# Rewrite SPA en la consola: source </^[^.]+$|\.(?!(css|gif|ico|jpg|js|png|txt|svg|woff|woff2|ttf|map|json|webmanifest)$)([^.]+$)/>, target /index.html, 200.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22 || nvm install 22
        - npm ci
    build:
      commands:
        - if [ "$AWS_BRANCH" = "develop" ]; then npm run build:develop; else npm run build; fi
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
